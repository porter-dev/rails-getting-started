version: v2
name: rails-getting-started
build:
  method: docker
  context: .
  dockerfile: ./Dockerfile
services:
  - name: web
    type: web
    run: /rails/bin/docker-entrypoint ./bin/rails server
    port: 3000
    cpuCores: 0.5
    ramMegabytes: 512
    healthCheck:
      enabled: true
      httpPath: /up
